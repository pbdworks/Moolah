name: Bug report
description: Laporkan masalah yang dapat direproduksi
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: steps
    attributes:
      label: Langkah reproduksi
      description: Jangan sertakan data finansial atau foto struk asli.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Hasil yang diharapkan
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Hasil aktual
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versi/perangkat
