name: OCR benchmark

on:
  workflow_dispatch:
  push:
    paths:
      - 'research/receipt-samples/**'
      - '.github/workflows/ocr-benchmark.yml'

permissions:
  contents: read

concurrency:
  group: ocr-benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install OCR engines
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-ind
          python -m pip install --upgrade pip
          python -m pip install 'paddleocr==3.2.0' 'paddlepaddle==3.2.0'
      - name: Run benchmark
        run: python research/ocr-benchmark/run_benchmark.py
      - name: Publish summary
        if: always()
        run: |
          if test -f research/ocr-benchmark/report.md; then cat research/ocr-benchmark/report.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ocr-benchmark-${{ github.sha }}
          path: |
            research/ocr-benchmark/results.json
            research/ocr-benchmark/report.md
